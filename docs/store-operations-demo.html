<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Operations — demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--brown:#1F3A2B;--accent:#BD5A2E;--cream:#FAF8F4;--bd:#D8CBB0;--sage:#9CAE8C;
--dark:#1A1A1A;--muted:#6B7280;--subtle:#9CA3AF;--panel:#F9F8F6;--white:#fff;
--g50:#EAF3DE;--g70:#3B6D11;--a50:#FAEEDA;--a60:#EF9F27;--a70:#854F0B;
--r50:#FCEBEB;--r60:#F09595;--r70:#A32D2D;--r80:#791F1F;
--p50:#EEEDFE;--p60:#AFA9EC;--p65:#534AB7;--p70:#3C3489;}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--dark);font:400 14px/1.5 'DM Sans','Noto Sans Thai',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.top{position:sticky;top:0;z-index:30;height:56px;background:var(--white);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px}
.brandmk{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;white-space:nowrap}
.demo{background:var(--a50);color:var(--a70);font-size:11px;padding:3px 9px;border-radius:10px;white-space:nowrap}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:218px;flex-shrink:0;background:var(--white);border-right:1px solid var(--bd);padding:12px 10px}
.main{flex:1;min-width:0;padding:20px 24px 70px;max-width:1300px}
.nav{display:flex;flex-direction:column;gap:2px}
.navlbl{font-size:11px;color:var(--subtle);padding:13px 10px 5px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:8px;padding:9px 10px;text-align:left;font-size:13px;color:var(--dark)}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="page"]{background:var(--panel);font-weight:500}
.nav button[aria-current="page"] .ic{color:var(--brown)}
.ic{width:17px;text-align:center;color:var(--muted);flex-shrink:0}
.nav .cnt{margin-left:auto;background:var(--a50);color:var(--a70);font-size:10px;padding:1px 7px;border-radius:9px}
h1{font-size:22px;font-weight:500;margin:0}
h2{font-size:15px;font-weight:500;margin:0}
.sub{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 7px}
.card{background:var(--white);border:1px solid var(--bd);border-radius:10px;padding:16px 18px}
.card+.card{margin-top:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin:12px 0}
.two .card+.card{margin-top:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.hd h2{flex:1;min-width:0}
.pagebar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pagebar h1{margin-right:auto}
.stats{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:132px;background:var(--panel);border:0;border-radius:8px;padding:11px 13px;text-align:left}
.stat .l{font-size:11px;color:var(--subtle);margin-bottom:4px}
.stat .v{font-size:20px;font-weight:500;line-height:1.1}
.stat .s{font-size:11px;color:var(--muted);margin-top:3px}
.stat.kpi{background:var(--white)}
.btn{height:36px;padding:0 14px;border:1px solid var(--bd);background:var(--white);border-radius:8px;font-size:12px;color:var(--brown);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel)}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.pri:hover{background:var(--accent);border-color:var(--accent)}
.btn.sm{height:30px;padding:0 11px}
.btn.wide{width:100%}
.btn[disabled]{background:#D3D1C7;border-color:#D3D1C7;color:#fff;cursor:not-allowed}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:0;border-radius:0;height:34px;padding:0 12px;font-size:12px;background:var(--white);color:var(--muted)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button[aria-pressed="true"]{background:var(--brown);color:#fff}
.seg.sec button[aria-pressed="true"]{background:#F1EFE8;color:var(--dark)}
.pill{display:inline-flex;align-items:center;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--white);padding:0 11px;gap:7px;font-size:12px;white-space:nowrap}
.pill select,.pill input{border:0;background:none;font-size:12px;color:var(--dark);padding:0;height:30px;width:auto}
.nav2{padding:0 2px}
.navlab{min-width:156px;text-align:center;font-size:12px}
.ghost{border:0;background:none;width:26px;height:30px;color:var(--muted);font-size:16px;line-height:1}
input,select{height:36px;border:1px solid var(--bd);border-radius:8px;background:var(--white);padding:0 10px;font-size:13px;color:var(--dark);width:100%}
.num{width:74px;flex-shrink:0;text-align:center;font-size:16px;font-weight:500}
.srch{position:relative;margin-bottom:8px}
.srch input{padding-left:31px}
.srch .ic{position:absolute;left:9px;top:10px}
.srch.narrow{max-width:280px}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;white-space:nowrap;display:inline-block}
.t-g{background:var(--g50);color:var(--g70)}.t-a{background:var(--a50);color:var(--a70)}
.t-r{background:var(--r50);color:var(--r70)}.t-p{background:var(--p50);color:var(--p70)}
.t-n{background:#F1EFE8;color:#888780}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.av.sm{width:22px;height:22px;font-size:9px}.av.xs{width:17px;height:17px;font-size:8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);font-weight:400;text-align:left;padding:8px 10px;background:var(--panel);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:9px 10px;border-top:1px solid var(--bd);font-size:13px;vertical-align:middle}
tr.mine td{background:#FBFBF9}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.rowbtn{width:100%;border:0;border-left:0;border-right:0;border-bottom:0;background:none;font:inherit;text-align:left}
.rowbtn:hover{background:var(--panel)}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--subtle)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.acc{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px}
.acc>button{width:100%;border:0;border-radius:0;background:var(--panel);padding:10px 12px;display:flex;align-items:center;gap:9px;text-align:left}
.acc>div{padding:10px 12px}
.acc.npd{border-color:var(--p60);background:#FBFBFE}
.acc.npd>button{background:var(--p50)}
.col{width:88px;text-align:right;flex-shrink:0}
.col .sub{display:block;font-size:10px}
.note{border-radius:8px;padding:10px 12px;font-size:12px;display:flex;gap:9px;align-items:flex-start}
.note.a{background:var(--a50);border:1px solid var(--a60);color:var(--a70)}
.note.r{background:var(--r50);border:1px solid var(--r60);color:var(--r80)}
.note.p{background:var(--p50);border:1px solid var(--p60);color:var(--p70)}
.note.g{background:var(--g50);border:1px solid var(--sage);color:#173404}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:13px}
.bar{height:5px;border-radius:3px;background:#F1EFE8;overflow:hidden;display:flex}
.bar i{display:block;height:5px}
.locked{border:1px dashed var(--bd);border-radius:10px;padding:34px 20px;text-align:center;background:var(--white)}
.chain{display:flex;align-items:center;background:var(--panel);border-radius:8px;padding:10px 6px;overflow-x:auto}
.cell{display:block;width:100%;border-radius:6px;font-size:10px;padding:6px 0;line-height:1.3;text-align:center}
.mcell{flex:1;height:22px;border:0;border-radius:3px;padding:0;min-width:6px}
.calwrap{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.calhead{display:flex;background:var(--panel)}
.calhead>div{flex:1;padding:8px 0;text-align:center;font-size:11px;color:var(--muted)}
.calhead>div+div{border-left:1px solid var(--bd)}
.calhead.sm>div{padding:3px 0;font-size:10px}
.calrow{display:flex;border-top:1px solid var(--bd)}
.calrow.sm{border:0;gap:2px;margin-bottom:2px}
.calcell{flex:1;min-height:74px;border:0;border-radius:0;padding:6px 5px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--white)}
.calcell+.calcell{border-left:1px solid var(--bd)}
.calcell.blank{background:#FBFAF7}
.cdate{font-size:11px}
.crow{display:flex;align-items:center;gap:2px}
.cdot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.who{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:12px;padding:3px 10px 3px 3px;font-size:12px}
.inb{border:1px solid var(--p60);background:#FBFBFE;border-radius:8px;padding:12px;margin-bottom:9px}
.inbday{background:var(--white);border:1px solid #CECBF6;border-radius:6px;padding:10px 11px;margin-bottom:7px}
.minical{border:1px solid #CECBF6;border-radius:8px;margin-top:6px;padding:9px;background:var(--white)}
.mini{flex:1;height:30px;border:0;border-radius:5px;font-size:11px;padding:0}
.daysbox{background:var(--white);border:1px solid #CECBF6;border-radius:8px;padding:11px;margin-top:12px}
.typebtn{flex:1;height:38px;border-radius:8px;font-size:12px}
.shbtn{flex:1;min-width:104px;height:46px;border-radius:8px;font-size:12px;line-height:1.3}
.tick{width:22px;height:22px;border-radius:5px;color:#fff;font-size:12px;padding:0}
.sumline{display:flex;padding:8px 0 0;border-top:1px solid var(--bd);margin-top:4px;font-size:13px}
.sumline.sm{font-size:12px;padding-top:7px;margin-top:3px}
.commbox{background:var(--panel);border-radius:8px;padding:9px 12px;margin-bottom:7px}
.drop{border:1px dashed var(--bd);border-radius:10px;padding:26px;text-align:center;background:#FBFAF7}
@media(max-width:900px){
.side{position:fixed;left:0;top:56px;bottom:0;z-index:25;transform:translateX(-100%);transition:transform .18s;overflow-y:auto}
body.open .side{transform:none;box-shadow:0 0 0 100vw rgba(26,26,26,.3)}
.main{padding:16px 13px 70px}
.mtoggle{display:inline-flex!important}
.hidesm{display:none}
.navlab{min-width:120px}
}
.mtoggle{display:none;border:1px solid var(--bd);background:#fff;border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;flex-shrink:0}

/* --- data-group hues --- */
.h-gr{--hue:#3B6D11;--hue-bg:#EAF3DE}
.h-pu{--hue:#3C3489;--hue-bg:#EEEDFE}
.h-te{--hue:#993C1D;--hue-bg:#FAECE7}
.h-bl{--hue:#0F5F5C;--hue-bg:#DCF0EE}
.h-am{--hue:#854F0B;--hue-bg:#FAEEDA}
.stat.kpi{border:1px solid var(--bd);border-top:3px solid var(--hue,var(--bd));position:relative}
.stat.kpi .l{color:var(--hue,var(--subtle))}
.stat.kpi.on{border:2px solid var(--hue);border-top:3px solid var(--hue);background:var(--hue-bg)}
.card.k-gr{border-left:3px solid #3B6D11}
.card.k-pu{border-left:3px solid #3C3489}
.card.k-te{border-left:3px solid #993C1D}
.card.k-bl{border-left:3px solid #0F5F5C}
.card.k-am{border-left:3px solid #854F0B}
.tint{display:none}
.card.k-gr th{background:#EAF3DE;color:#2C5209}
.card.k-pu th{background:#EEEDFE;color:#3C3489}
.card.k-te th{background:#FAECE7;color:#7C3017}
.card.k-bl th{background:#DCF0EE;color:#0F5F5C}
.ey-gr{color:#3B6D11}
.ey-te{color:#993C1D}
/* --- one date control --- */
.dctl{display:inline-flex;align-items:center;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--white);overflow:hidden}
.dctl>button{border:0;background:none;height:32px;padding:0 12px;font-size:12px;color:var(--muted)}
.dctl>button[aria-pressed="true"]{background:var(--brown);color:#fff}
.dctl .dsep{width:1px;height:32px;background:var(--bd);flex-shrink:0}
.dctl .ghost{width:26px;height:32px;font-size:16px;line-height:1}
.dctl .navlab{min-width:150px;text-align:center;font-size:12px;color:var(--dark)}
.dctl .dpick{display:flex;align-items:center;gap:5px;padding:0 9px 0 8px;position:relative}
.dctl .dpick input{border:0;height:32px;width:20px;padding:0;opacity:0;position:absolute;left:0;top:0;cursor:pointer}
.dctl .dpick .ic{color:var(--muted);pointer-events:none}
/* --- inventory tables --- */
table.inv td{vertical-align:top}
table.inv td.nowrap{white-space:nowrap}
.num-c{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
table.inv tr.lo td{background:#FEF7F7}
table.inv tr.lo td:first-child{box-shadow:inset 3px 0 0 var(--r70)}
table.inv tr.ov td{background:#FAFAFE}
table.inv tr.ov td:first-child{box-shadow:inset 3px 0 0 var(--p65)}
.num-c.bad{color:var(--r70)}
.num-c.over{color:var(--p65)}
.keys{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.sw.lo{background:#FEF7F7;box-shadow:inset 3px 0 0 var(--r70)}
.sw.ov{background:#FAFAFE;box-shadow:inset 3px 0 0 var(--p65)}
@media(max-width:900px){.dctl .navlab{min-width:110px}}

/* ===== dashboard KPI cards ===== */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kcard{border:1px solid var(--bd);border-radius:12px;background:var(--white);padding:13px 14px 0;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative;min-height:124px}
.kcard:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hue)}
.kcard.on{border:2px solid var(--hue);padding:12px 13px 0;background:linear-gradient(180deg,var(--hue-bg) 0%,#fff 62%)}
.krow{display:flex;align-items:center;gap:8px}
.klabel{flex:1;font-size:12px;color:var(--muted)}
.kval{font-size:22px;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.delta{font-size:11px;font-weight:500;padding:2px 7px;border-radius:9px;white-space:nowrap}
.delta.up{background:var(--g50);color:var(--g70)}
.delta.down{background:var(--r50);color:var(--r70)}
.spk{display:block;width:calc(100% + 28px);margin:6px -14px 0;height:30px}
.kcard.on .spk{width:calc(100% + 26px);margin-left:-13px;margin-right:-13px}
.ksub{position:absolute;left:14px;bottom:8px;font-size:10px;color:var(--subtle)}
/* ===== goal progress ===== */
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.gitem{min-width:0}
.gtop{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:13px}
.gpct{font-weight:500;font-variant-numeric:tabular-nums}
.gbar{height:7px;border-radius:4px;background:#F1EFE8;overflow:hidden}
.gbar i{display:block;height:7px;border-radius:4px}
.g1{color:#A32D2D}.gbar i.g1{background:#D8654A}
.g2{color:#854F0B}.gbar i.g2{background:#EF9F27}
.g3{color:#3B6D11}.gbar i.g3{background:#9CAE8C}
.g4{color:#1F3A2B}.gbar i.g4{background:#1F3A2B}
.gfoot{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11px}
/* ===== custom range ===== */
.dwrap{position:relative;display:inline-block}
.dctl .wide2{width:32px}
.rangebox{position:absolute;z-index:20;top:40px;left:0;min-width:290px;background:var(--white);border:1px solid var(--bd);border-radius:10px;padding:13px;box-shadow:0 8px 24px rgba(31,58,43,.12)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rgrid label{display:block}
.rgrid .sub{display:block;margin-bottom:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* ===== mobile tab bar ===== */
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--bd);padding:4px 2px calc(4px + env(safe-area-inset-bottom));}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--muted);position:relative;min-height:52px;justify-content:center}
.tabs button[aria-current="page"]{color:var(--brown);font-weight:500}
.tico{font-size:17px;line-height:1}
.tdot{position:absolute;top:5px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
#scrim{display:none}
@media(max-width:900px){
.tabs{display:flex}
#scrim{display:none;position:fixed;inset:56px 0 0;background:rgba(26,26,26,.34);z-index:24}
body.open #scrim{display:block}
body.open .side{box-shadow:none}
.main{padding-bottom:86px}
.kgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kcard{min-height:112px;padding:11px 12px 0}
.kval{font-size:19px}
.rangebox{left:auto;right:0;min-width:270px}
/* touch targets */
.btn{height:42px;padding:0 16px;font-size:13px}
.btn.sm{height:34px}
input,select{height:42px;font-size:15px}
.num{height:46px!important;font-size:18px;width:82px}
.row{padding:12px 0}
.seg button,.dctl>button{height:40px;padding:0 13px}
.dctl{height:42px}.dctl .ghost{height:40px;width:32px}
.dctl .dsep{height:40px}
.pill{height:42px}.pill select,.pill input{height:38px}
.acc>button{padding:13px 12px}
.nav button{padding:12px 10px;font-size:14px}
.stats{gap:8px}
.stat{min-width:calc(50% - 4px)}
.two{gap:10px}
.card{padding:14px}
.acts .btn{min-width:calc(50% - 4px)}
h1{font-size:19px}
.pagebar{gap:7px}
/* sticky submit on key-in screens */
.card:last-child .btn.pri.wide{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom))}
}
@media(max-width:560px){
.kgrid{grid-template-columns:1fr 1fr}
.dwrap{width:100%}
.dctl{width:100%;justify-content:space-between}
.dctl .navlab{flex:1;min-width:0}
.rangebox{left:0;right:0;min-width:0}
.rgrid{grid-template-columns:1fr}
.stat{min-width:100%}
.acts .btn{min-width:100%}
.ggrid{grid-template-columns:1fr}
}

/* coverage grid */
table.cover th.cday{min-width:26px;text-align:center;padding:7px 2px;font-size:10px}
table.cover th.cday.we{background:#F1EFE8}
table.cover th.cday.hol{background:var(--r50);color:var(--r70)}
td.cvcell{padding:3px 2px;text-align:center}
.cv{width:24px;height:24px;border:0;border-radius:5px;font-size:11px;font-weight:500;padding:0;line-height:1}
.cv.cv0{background:var(--r50);color:var(--r70);box-shadow:inset 0 0 0 1px var(--r60)}
.cv.cv1{background:#FAEEDA;color:#854F0B}
.cv.cv2{background:#EAF3DE;color:#3B6D11}
.cv.cv3{background:#1F3A2B;color:#fff}
.sw.cv0{background:var(--r50);box-shadow:inset 0 0 0 1px var(--r60)}
.sw.cv1{background:#FAEEDA}.sw.cv2{background:#EAF3DE}.sw.cv3{background:#1F3A2B}
/* date chip used by calendar, OT and deliveries */

var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function ym(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function daysIn(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}

if(per=="day")d.setDate(d.getDate()+dir);

function dnum(a,b){return Math.round((b-a)/86400000)+1}

if(b<a){var t=a;a=b;b=t}return[a,b]}

if(per=="custom"){var r=cDates();
return r[0].getDate()+" "+MS[r[0].getMonth()]+" – "+r[1].getDate()+" "+MS[r[1].getMonth()]+" "+r[1].getFullYear()}
if(per=="day")return d.getDate()+" "+MS[d.getMonth()]+" "+d.getFullYear();
if(per=="week"){var a=weekStart(d),b=new Date(a);b.setDate(b.getDate()+6);
return a.getDate()+" "+MS[a.getMonth()]+" – "+b.getDate()+" "+MS[b.getMonth()]+" "+b.getFullYear()}
return MN[d.getMonth()]+" "+d.getFullYear()}
function periodKey(per){var d=S.cur;
if(per=="custom")return S.c0+"_"+S.c1;
if(per=="day")return iso(d);
if(per=="week")return iso(weekStart(d));

function seedOf(k){var h=2166136261;for(var i=0;i<k.length;i++){h^=k.charCodeAt(i);h=(h*16777619)>>>0}return h}
function factor(per){var base;
if(per=="custom"){var r=cDates();base=.033*dnum(r[0],r[1])}
else base={day:.033,week:.23,month:1}[per];
return base*(0.82+(seedOf(periodKey(per))%40)/100)}

var a=new Date(r[0]);a.setDate(a.getDate()+dir*n);

S.c0=iso(a);S.c1=iso(b)}

for(var i=0;i<n;i++){h=(h*1664525+1013904223)>>>0;a.push(lo+(h%1000)/1000*(hi-lo))}return a}

for(i=0;i<lg.length;i++)rows.push([lg[i].d,lg[i].br,lg[i].c,lg[i].n,lg[i].un,lg[i].ty,lg[i].q,lg[i].to,lg[i].who]);
csv(rows,"stock-movement-"+iso(S.cur)+".csv");return}
if(t.closest("#expPay")){var staff=PEOPLE.filter(isShopStaff);

for(i=0;i<staff.length;i++){var p=staff[i],d=0;for(var bn in (p.at||{}))d+=p.at[bn];
var pay=p.type=="part"?p.rate*p.hrs:0;
rows.push([p.n,p.type=="part"?"Part-time":"Full-time",d,Math.round(otOf(p)),Math.round(commOf(p)),pay,Math.round(otOf(p)+commOf(p)+pay)])}
csv(rows,"payout-"+ym(S.cur)+".csv");return}
var sp=g("data-span");if(sp){S.span=sp;S.pick=null;S.selDay=null;render();return}
var ms=g("data-msub");if(ms){S.msub=ms;S.pick=null;S.selDay=null;render();return}
if(t.closest("#edit")){S.edit=1;render();return}
if(t.closest("#shopen")){S.shEdit=1;render();return}
if(t.closest("#shx")){S.shEdit=0;render();return}
if(t.closest("#shSave")){S.shEdit=0;render();return}
if(t.closest("#pub")){PUBLISHED[pubKey()]=1;S.edit=0;S.pick=null;S.draft=0;render();return}
if(t.closest("#disc")){S.edit=0;S.pick=null;S.draft=0;render();return}
if(t.closest("#copyPrev")||t.closest("#blankMonth")){PUBLISHED[pubKey()]=1;
if(t.closest("#blankMonth"))for(var nkey in ROSTER)for(i=0;i<31;i++)ROSTER[nkey][i]="O";
S.edit=1;render();return}
if(t.closest("#pickx")){S.pick=null;render();return}
if(t.closest("#dayx")){S.selDay=null;render();return}
var ce=g("data-cell");if(ce){var q2=ce.split("|");S.pick={p:q2[0],d:+q2[1]};render();return}
var se=g("data-set");if(se&&S.pick){ROSTER[S.pick.p][S.pick.d]=se;S.draft++;S.pick=null;render();return}
var dy=g("data-day");if(dy!==null){var dv=+dy;S.selDay=(S.selDay===dv)?null:dv;render();return}
var ra=g("data-rap");if(ra){for(i=0;i<REQS.length;i++)if(REQS[i].id==+ra){var r2=REQS[i];r2.st="approved";
for(j=0;j<r2.days.length;j++){var x=r2.days[j];if(!x.ok)continue;
if(r2.t=="off")ROSTER[r2.who][x.d]="L";else{var tp2=ROSTER[r2.who][x.d];ROSTER[r2.who][x.d]=ROSTER[x.w][x.d];ROSTER[x.w][x.d]=tp2}}}
render();return}
var rd2=g("data-rdc");if(rd2){for(i=0;i<REQS.length;i++)if(REQS[i].id==+rd2)REQS[i].st="declined";render();return}
var ia=g("data-ia")||g("data-idc");if(ia){var acc=!!g("data-ia"),p3=ia.split("|");
for(i=0;i<INBOX.length;i++)if(INBOX[i].id==+p3[0]){INBOX[i].days[+p3[1]].ok=acc?1:0;
var all=INBOX[i].days.every(function(z){return z.ok!==null});
if(all&&INBOX[i].days.some(function(z){return z.ok}))
REQS.push({id:INBOX[i].id,t:"swap",who:INBOX[i].who,note:INBOX[i].note,st:"pending",days:INBOX[i].days})}
render();return}
if(t.closest("#newreq")){S.form=1;S.ft="swap";S.err="";render();return}
if(t.closest("#fcan")){S.form=0;S.r0=null;S.r1=null;S.dmap={};S.fnote="";S.err="";S.cal2=0;render();return}
if(t.closest("#rb")){S.cal2=!S.cal2;render();return}
var rdd=g("data-rd");if(rdd!==null){var dv2=+rdd;
if(S.r0===null||S.r1!==null){S.r0=dv2;S.r1=null}else{S.r1=dv2;S.cal2=0}
S.dmap={};S.err="";render();return}
var ftb=g("data-ft");if(ftb){S.ft=ftb;S.err="";render();return}
if(t.closest("#fsub")){
if(S.r0===null){S.err="Choose your dates first.";render();return}
var lo=S.r1===null?S.r0:Math.min(S.r0,S.r1),hi=S.r1===null?S.r0:Math.max(S.r0,S.r1),dd=[];
for(var d=lo;d<=hi;d++){var c2=ROSTER[S.me][d]||"O";if(c2=="O"||c2=="L")continue;
if(S.ft=="swap"){if(!S.dmap[d]){S.err="Choose who covers "+(d+1)+" "+MS[S.cur.getMonth()]+".";render();return}
dd.push({d:d,w:S.dmap[d],ok:null})}else dd.push({d:d,w:"",ok:1})}
if(!dd.length){S.err="Every day you picked is already a day off.";render();return}
MINE.unshift({id:Date.now(),t:S.ft,st:"waiting",days:dd});
if(S.ft=="off")REQS.push({id:Date.now(),t:"off",who:S.me,note:S.fnote,st:"pending",days:dd});
S.form=0;S.r0=null;S.r1=null;S.dmap={};S.fnote="";S.err="";render();return}
var sl=g("data-salesTab");if(sl){S.salesTab=sl;S.q="";render();return}
var bl=g("data-billsTab");if(bl){S.billsTab=bl;render();return}
if(t.closest("#upReset")){S.uploaded=0;S.saved=0;for(i=0;i<FLDS.length;i++)S.map[FLDS[i].k]="";render();return}
if(t.closest("#iguess")){for(i=0;i<FLDS.length;i++)S.map[FLDS[i].k]=FLDS[i].g;render();return}
if(t.closest("#isave")){S.saved=1;render();return}
var rt=g("data-rtab");if(rt){S.rtab=rt;render();return}
var rp2=g("data-rp");if(rp2){S.rOpen[rp2]=!S.rOpen[rp2];render();return}
var en=g("data-earn");if(en){var p4=en.split("|"),st2=PEOPLE.filter(isShopStaff)[+p4[0]],bn3=BR[+p4[1]].n;
var ix=st2.earn.indexOf(bn3);if(ix>=0)st2.earn.splice(ix,1);else st2.earn.push(bn3);render();return}
var sht=g("data-shTab");if(sht){S.shTab=sht;S.cov=null;S.otPick=null;render();return}
var cv=g("data-cov");if(cv){var q3=cv.split("|");S.cov={b:q3[0],d:+q3[1]};render();return}
if(t.closest("#covx")){S.cov=null;render();return}
if(t.closest("#otNew")){S.otPick={id:0,who:rosterPeople()[0].n,d:S.cur.getDate()-1,sh:"A",from:SH.A.f,to:SH.A.t,note:"",st:"pending"};render();return}
var oe=g("data-otedit");if(oe){for(i=0;i<OT.length;i++)if(OT[i].id==+oe)S.otPick=OT[i];render();return}
if(t.closest("#otx")){S.otPick=null;render();return}
if(t.closest("#otSave")){if(S.otPick&&!S.otPick.id){S.otPick.id=Date.now();OT.push(S.otPick)}S.otPick=null;render();return}
var od=g("data-otdel");if(od){for(i=0;i<OT.length;i++)if(OT[i].id==+od){OT.splice(i,1);break}S.otPick=null;render();return}
if(t.closest("#evNew")){S.evForm=1;S.err="";render();return}
if(t.closest("#evCan")){S.evForm=0;S.err="";render();return}
if(t.closest("#evSave")){if(!S.evN.trim()){S.err="Give the event a name.";render();return}
EVENTS.push({id:Date.now(),d:S.evD,ty:S.evT,n:S.evN,br:S.evB});S.evForm=0;S.evN="";S.err="";render();return}
var ed=g("data-evdel");if(ed){for(i=0;i<EVENTS.length;i++)if(EVENTS[i].id==+ed){EVENTS.splice(i,1);break}render();return}
if(t.closest("#dlNew")){S.dlForm=1;S.err="";render();return}
if(t.closest("#dlCan")){S.dlForm=0;S.err="";render();return}
if(t.closest("#dlSave")){if(!S.dlI){S.err="How many item lines are coming?";render();return}
DELIV.push({id:Date.now(),br:S.dlB,d:S.dlD,slot:S.dlS,items:+S.dlI,ref:"DO-"+Date.now().toString().slice(-8),st:"scheduled",by:"Big S."});
S.dlForm=0;S.dlI="";S.err="";render();return}
var dn=g("data-dlnext");if(dn){for(i=0;i<DELIV.length;i++)if(DELIV[i].id==+dn)DELIV[i].st=(DELIV[i].st=="scheduled"?"in transit":"delivered");render();return}
var rv=g("data-rcv");if(rv){S.rcvId=+rv;S.rcv={};S.rrsn={};S.rnote={};render();return}
if(t.closest("#rcvBack")){S.rcvId=0;render();return}
if(t.closest("#rcvSave")){var dl2=null;for(i=0;i<DELIV.length;i++)if(DELIV[i].id==S.rcvId)dl2=DELIV[i];
if(dl2){var ls=lines(dl2.id);
for(i=0;i<ls.length;i++){var cd=ls[i][0],got=+S.rcv[cd],exp=ls[i][3];
LEDGER.unshift({d:"8 Sep 11:20",br:dl2.br,c:cd,n:ls[i][1],un:ls[i][2],ty:"Received",q:got,who:S.me,to:"From central warehouse \u00b7 "+dl2.ref});
if(got!==exp)SHORTS.unshift({id:Date.now()+i,dl:dl2.id,br:dl2.br,c:cd,n:ls[i][1],un:ls[i][2],exp:exp,got:got,rsn:S.rrsn[cd],note:S.rnote[cd]||"",by:S.me,d:"8 Sep 11:20",st:"open"})}
dl2.st="received"}
S.rcvId=0;S.rcv={};S.rrsn={};S.rnote={};render();return}
var sc=g("data-shclose");if(sc){for(i=0;i<SHORTS.length;i++)if(SHORTS[i].id==+sc)SHORTS[i].st="closed";render();return}
if(t.closest("#syncGo")){SYNC.running=1;render();
setTimeout(function(){SYNC.running=0;SYNC.pulled=147;SYNC.added=3;SYNC.updated=144;SYNC.failed=SYNC.fails.length;
SYNC.at="16 Sep 2026, "+new Date().toTimeString().slice(0,5);render()},900);return}
if(t.closest("#xNew")){S.xForm=1;S.xq={};S.xN="";S.q="";S.err="";render();return}
if(t.closest("#xCan")){S.xForm=0;S.xq={};S.xN="";S.err="";render();return}
if(t.closest("#xSave")){
if(S.xF==S.xT){S.err="From and to cannot be the same place.";render();return}
var ls=[],tot=0;
for(var kk in S.xq){if(!(+S.xq[kk]>0))continue;
for(i=0;i<PROD.length;i++)if(PROD[i].c==kk){ls.push([kk,PROD[i].n,PROD[i].un,+S.xq[kk]]);tot+=+S.xq[kk]}}
if(!ls.length){S.err="Enter a quantity for at least one product.";render();return}
XFER.unshift({id:Date.now(),from:S.xF,to:S.xT,d:iso(TODAY),ref:"TR-"+Date.now().toString().slice(-8),st:"sent",by:S.me,lines:ls,note:S.xN});
for(i=0;i<ls.length;i++){
LEDGER.unshift({d:"8 Sep 12:40",br:S.xF,c:ls[i][0],n:ls[i][1],un:ls[i][2],ty:"Transfer out",q:-ls[i][3],who:S.me,to:"To "+S.xT});
if(S.xT!="Central warehouse")LEDGER.unshift({d:"8 Sep 12:40",br:S.xT,c:ls[i][0],n:ls[i][1],un:ls[i][2],ty:"Transfer in",q:ls[i][3],who:S.me,to:"From "+S.xF})}
S.xForm=0;S.xq={};S.xN="";S.err="";render();return}
if(t.closest("#expWh")){var r=whStock(),rows=[["whCode","Warehouse","Branch","Product code","Product","Unit","Balance"]];
for(i=0;i<r.length;i++)rows.push([r[i].wh,r[i].whn,r[i].br||"",r[i].c,r[i].n,r[i].un,r[i].bal]);
csv(rows,"acccloud-warehouse-stock-"+iso(S.cur)+".csv");return}
var se2=g("data-settab");if(se2){S.settab=se2;S.q="";S.focus=null;render();return}
});
document.addEventListener("input",function(ev){var t=ev.target;
if(t.id=="q"||t.id=="sq"){S.q=t.value;S.focus=t.id;render()}
else if(t.id=="fnote"){S.fnote=t.value}
else if(t.id=="vt"){S.tmp=t.value.replace(/[^0-9]/g,"");S.focus="vt";render()}
else if(t.id=="vnt"){S.tmpN=t.value}
else if(t.hasAttribute("data-sc")){S.cnt[t.getAttribute("data-sc")]=t.value.replace(/[^0-9]/g,"");
var c=counted(),l=stkList(),lab=document.querySelector("#main .stat .v");
if(lab)lab.textContent=c+" / "+l.length;
var btn=document.getElementById("subCount");if(btn)btn.disabled=(c<l.length);
t.style.borderColor=t.value?"var(--sage)":"var(--bd)"}
else if(t.hasAttribute("data-bq")){S.bq[t.getAttribute("data-bq")]=t.value;S.focus=t.getAttribute("data-bq");render()}
else if(t.hasAttribute("data-mp")){S.mprod[t.getAttribute("data-mp")]=t.value.replace(/[^0-9]/g,"")}
else if(t.hasAttribute("data-mc")){S.mctry[t.getAttribute("data-mc")]=t.value.replace(/[^0-9]/g,"")}
else if(t.id=="evN"){S.evN=t.value}
else if(t.id=="otN"&&S.otPick){S.otPick.note=t.value}
else if(t.id=="dlI"){S.dlI=t.value.replace(/[^0-9]/g,"")}
else if(t.id=="xN"){S.xN=t.value}
else if(t.hasAttribute("data-xq")){S.xq[t.getAttribute("data-xq")]=t.value.replace(/[^0-9]/g,"");S.focus=null;render()}
else if(t.hasAttribute("data-rc")){S.rcv[t.getAttribute("data-rc")]=t.value.replace(/[^0-9]/g,"");render()}
else if(t.hasAttribute("data-rn")){S.rnote[t.getAttribute("data-rn")]=t.value}
});
document.addEventListener("change",function(ev){var t=ev.target;
if(t.id=="roleSel"){S.role=t.value;roleChanged();return}
if(t.id=="brSel"){S.branch=t.value;render();return}
if(t.id=="scSel"){S.scBranch=t.value;S.cnt={};S.done=0;render();return}
if(t.id=="upSel"){S.upBranch=t.value;S.uploaded=0;S.saved=0;render();return}
if(t.id=="c0"&&t.value){S.c0=t.value;render();return}
if(t.id=="c1"&&t.value){S.c1=t.value;render();return}
if(t.id=="jump"&&t.value){var p=t.value.split("-");S.cur=new Date(+p[0],+p[1]-1,+p[2]);S.selDay=null;render();return}
if(t.id=="mvType"){S.mvType=t.value;render();return}
if(t.id=="vrs"){S.tmp=t.value;return}
if(t.id=="fileA"||t.id=="fileB"){if(!S.upBranch)S.upBranch=visBranches()[0];S.uploaded=1;render();return}
if(t.hasAttribute("data-map")){S.map[t.getAttribute("data-map")]=t.value;render();return}
if(t.hasAttribute("data-dm")){S.dmap[t.getAttribute("data-dm")]=t.value;S.err="";return}
if(t.id=="evD"){S.evD=t.value;return}
if(t.id=="evT"){S.evT=t.value;return}
if(t.id=="evB"){S.evB=t.value;return}
if(t.id=="dlB"){S.dlB=t.value;return}
if(t.id=="xF"){S.xF=t.value;S.err="";render();return}
if(t.id=="xT"){S.xT=t.value;S.err="";render();return}
if(t.id=="dlD"){S.dlD=t.value;return}
if(t.id=="dlS"){S.dlS=t.value;return}
if((t.id=="otF"||t.id=="otT")&&S.otPick){if(t.id=="otF")S.otPick.from=t.value;else S.otPick.to=t.value;render();return}
if(t.hasAttribute("data-rr")){S.rrsn[t.getAttribute("data-rr")]=t.value;render();return}
if(t.hasAttribute("data-sht")){var q=t.getAttribute("data-sht").split("|");SH[q[0]][q[1]]=t.value;return}
});
roleChanged();

</script>
